name: Mobile and browser regression
on:
  push:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'release.json'
      - 'tests/**'
      - '.github/workflows/mobile-regression.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.51.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=tests/playwright.config.cjs
